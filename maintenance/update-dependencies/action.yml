name: Update dependencies
description: Run pinned Renovate for one explicit GitHub repository without host tools or a Docker socket
inputs:
  repository:
    description: GitHub owner/repository to maintain
    required: true
  dry-run:
    description: Resolve proposed updates without creating branches or pull requests
    default: 'false'
  token:
    description: Dedicated bot or App installation token with repository update and pull request permissions
    required: true
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/maintenance-update-dependencies@sha256:c66d1b8f9fd9fdc57389ca8866c5a8b2f49e1dd51cfe7c8bfe645b1e05e8b724
  env:
    RENOVATE_TOKEN: ${{ inputs.token }}
  args:
    - --repository=${{ inputs.repository }}
    - --dry-run=${{ inputs.dry-run }}

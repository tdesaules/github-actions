name: New catalog SBOMs
description: Generate SPDX and evidence-rich Syft reports for both pinned image architectures
inputs:
  output:
    description: Directory for per-image per-architecture reports
    default: .build/maintenance
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/maintenance-new-catalog-sboms@sha256:b3154f7c21bee113a3f235f235ef0ce70ab4c9bc95b90fe10dd35a86bbe8badb
  args:
    - --output=${{ inputs.output }}

name: Lint Rust GTK application
description: Check Rust formatting, Clippy, plugin syntax and package locks
inputs:
  directory:
    description: Application checkout
    default: .
  output:
    description: JSON lint report relative to workspace
    default: .build/lint/rust-gtk.json
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/lint-rust-gtk@sha256:d8de62dcebbf44fe9701aa8a3bc2a212b9f11daacf290b1fe7160bab7765fcad
  args:
    - --directory=${{ inputs.directory }}
    - --output=${{ inputs.output }}

name: Lint Rust GTK application
description: Check Rust formatting, Clippy, plugin syntax and package locks
inputs:
  directory:
    description: Application checkout
    default: .
  output:
    description: JSON lint report relative to workspace
    default: .build/lint/rust-gtk.json
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/lint-rust-gtk@sha256:33eb6ff7cc2503416ea2bfe7e2e736e1f36faa87deed1786ffe118b5e63b83a2
  args:
    - --directory=${{ inputs.directory }}
    - --output=${{ inputs.output }}

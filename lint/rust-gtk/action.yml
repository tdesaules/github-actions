name: Lint Rust GTK application
description: Check Rust formatting, Clippy, plugin syntax and package locks
inputs:
  directory:
    description: Application checkout
    default: .
  output:
    description: JSON lint report relative to workspace
    default: .build/lint/rust-gtk.json
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/lint-rust-gtk@sha256:c6fd5866f40b5944a3ea7e5686a03682ff4a8e7d4fcd3cf2d31d6f510f64e884
  args:
    - --directory=${{ inputs.directory }}
    - --output=${{ inputs.output }}

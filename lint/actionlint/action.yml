name: Test GitHub workflow
description: Validate GitHub Actions workflows with actionlint (ShellCheck and Pyflakes integrations disabled)
inputs:
  files:
    description: Nonempty JSON array of workflow file paths, without glob expansion
    required: true
outputs:
  checked:
    description: Number of checked files
  passed:
    description: Whether every selected file passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-github-workflow@sha256:42709f3325f5372dc5e489ed82d525a4a7658d77b61b8f3602fa9995af364e60
  args:
    - --files=${{ inputs.files }}

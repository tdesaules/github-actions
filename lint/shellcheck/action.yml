name: Test shell
description: Check shell scripts with ShellCheck, including extensionless files with a shell shebang
inputs:
  files:
    description: Nonempty JSON array of shell script paths, without glob expansion
    required: true
outputs:
  checked:
    description: Number of checked files
  passed:
    description: Whether every selected file passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-shell@sha256:753027b74791d095b4d8880964a87b94fe6c4b4e00c50f3d642b0db86b5b125d
  args:
    - --files=${{ inputs.files }}

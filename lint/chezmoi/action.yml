name: Lint rendered dotfiles
description: Render isolated profiles and validate generated configuration
inputs:
  directory:
    description: Trusted consumer checkout relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/lint-chezmoi@sha256:16422260a97998bf8fee48e04b6e28b8bfa9462cbe894439f447eb434a90d22f
  env:
    INPUT_DIRECTORY: ${{ inputs.directory }}

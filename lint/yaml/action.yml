name: Test YAML
description: Validate YAML syntax and duplicate mapping keys, including multi-document streams, without modifying files
inputs:
  files:
    description: Nonempty JSON array of YAML file paths, without glob expansion
    required: true
outputs:
  checked:
    description: Number of checked files
  passed:
    description: Whether every selected file passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-yaml@sha256:34095afb49e63edf200d9d9d372f2427445637ee982b7c94b818eb52ff6fb0cc
  args:
    - --files=${{ inputs.files }}

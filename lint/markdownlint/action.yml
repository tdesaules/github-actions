name: Test Markdown
description: Lint explicitly selected Markdown files with markdownlint without glob expansion
inputs:
  files:
    description: Nonempty JSON array of literal Markdown paths, without glob expansion
    required: true
outputs:
  checked:
    description: Number of checked files
  passed:
    description: Whether every file passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-markdown@sha256:e04cf0157ef5451b65796c39417347ffb77f76733cba2fc50f3e40b79d8476a9
  args:
    - --files=${{ inputs.files }}

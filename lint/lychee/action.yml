name: Test links
description: Check links in explicitly selected files with Lychee
inputs:
  files:
    description: Nonempty JSON array of file paths
    required: true
  config:
    description: Optional path to a Lychee TOML configuration
outputs:
  checked:
    description: Number of checked files
  passed:
    description: Whether every file passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-links@sha256:075a69547942d1a4479342e1fa72eed39e485296b0e6d2d3ee60ac5eca9f1573
  args:
    - --files=${{ inputs.files }}
    - --config=${{ inputs.config }}

name: Test Containerfile
description: Check Containerfiles with Hadolint without modifying source files
inputs:
  files:
    description: Nonempty JSON array of Containerfile paths, without glob expansion
    required: true
outputs:
  checked:
    description: Number of checked files
  passed:
    description: Whether every selected file passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-containerfile@sha256:36655fc3a61d583b3797006b774b0ce69ad1e56f128ea3a0436117e945a3e925
  args:
    - --files=${{ inputs.files }}

name: Validate Renovate configuration
description: Validate against the exact Renovate runtime used by maintenance
inputs:
  directory:
    description: Trusted consumer checkout relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/lint-renovate@sha256:bfdc809c3418f75cb1b2e2006a690c449eb7b6b8ca9ce0c932b5ae2a0a137380
  env:
    INPUT_DIRECTORY: ${{ inputs.directory }}

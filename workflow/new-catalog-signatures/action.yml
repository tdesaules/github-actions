name: New catalog signatures
description: Sign newly published index and platform digests with GitHub OIDC
inputs:
  directory:
    description: Verified publication plan directory
    default: .build/publication
  registry-username:
    description: GHCR username
    required: true
  registry-password:
    description: GHCR write token
    required: true
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-new-catalog-signatures@sha256:95313eecb3b5b5e8256ed514056b4ec437bf83ec952277995668dfc49240f2d1
  env:
    INPUT_REGISTRY-USERNAME: ${{ inputs.registry-username }}
    INPUT_REGISTRY-PASSWORD: ${{ inputs.registry-password }}
  args:
    - --directory=${{ inputs.directory }}

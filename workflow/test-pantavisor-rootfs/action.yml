name: Test Pantavisor rootfs
description: Execute the producer ARM64 binary smoke tests against its exported rootfs
inputs:
  directory:
    description: Producer checkout
    default: .
  component:
    description: Verified public export
    default: dist/component
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-test-pantavisor-rootfs@sha256:9fe0a0f0859340645318c36503f3e39ff51ebf6bb1d8caa7d2fd2156d91538c1
  args:
    - --directory=${{ inputs.directory }}
    - --component=${{ inputs.component }}

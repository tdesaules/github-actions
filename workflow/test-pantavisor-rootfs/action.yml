name: Test Pantavisor rootfs
description: Execute the producer ARM64 binary smoke tests against its exported rootfs
inputs:
  directory:
    description: Producer checkout
    default: .
  component:
    description: Verified public export
    default: dist/component
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-test-pantavisor-rootfs@sha256:5ccbe066f86cd7236319c5257f68e2ecb27b417d2f4e4fca357de7d9348789c6
  args:
    - --directory=${{ inputs.directory }}
    - --component=${{ inputs.component }}

name: Test Pantavisor rootfs
description: Execute the producer ARM64 binary smoke tests against its exported rootfs
inputs:
  directory:
    description: Producer checkout
    default: .
  component:
    description: Verified public export
    default: dist/component
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-test-pantavisor-rootfs@sha256:d7c3350d532b3bf585afeba34e4d51da51f0d0d0b40b7a4108c513c53766fb36
  args:
    - --directory=${{ inputs.directory }}
    - --component=${{ inputs.component }}

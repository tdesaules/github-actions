name: Test Pantavisor rootfs
description: Execute the producer ARM64 binary smoke tests against its exported rootfs
inputs:
  directory:
    description: Producer checkout
    default: .
  component:
    description: Verified public export
    default: dist/component
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-test-pantavisor-rootfs@sha256:dd7d4bb9d9c8a422f808dba5619a78743b3c5377190605304a81f3e0541a1fc6
  args:
    - --directory=${{ inputs.directory }}
    - --component=${{ inputs.component }}

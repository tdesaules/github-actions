name: Import Pantavisor candidate
description: Verify and check out the exact candidate commit from its Git bundle
inputs:
  directory: {description: Candidate bundle and metadata directory, default: artifacts/release}
outputs:
  revision: {description: Imported candidate commit}
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-import-pantavisor-candidate@sha256:8e22be2ddb93e423a3794f2b2e7eb14191a9ab6838b59e2f74d731ae62f422b9
  args:
    - --directory=${{ inputs.directory }}

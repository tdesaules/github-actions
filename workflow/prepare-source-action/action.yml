name: Prepare source action
description: Temporarily qualify an unpublished source control with the established OCI actions
inputs:
  directory:
    description: Source action directory
    required: true
  image:
    description: Owned catalogue image name
    required: true
  host-port:
    description: Isolated candidate registry port
    required: true
runs:
  using: composite
  steps:
    - name: Build exact source
      id: build
      uses: ./oci/build-image
      with:
        containerfile: ${{ inputs.directory }}/Containerfile
        image: localhost/${{ inputs.image }}
        version: bootstrap
        labels: '{"org.opencontainers.image.revision":"${{ github.sha }}"}'
        platform: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        output: .build/bootstrap/${{ inputs.image }}/image.oci.tar
    - name: Record source archive
      uses: ./workflow/new-build-receipt
      with:
        archive: .build/bootstrap/${{ inputs.image }}/image.oci.tar
        expected-sha256: ${{ steps.build.outputs.archive-sha256 }}
        image: ${{ inputs.image }}
        architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
        revision: ${{ github.sha }}
        version: bootstrap
        output: .build/bootstrap/${{ inputs.image }}/build.json
    - name: Verify exact source archive
      uses: ./workflow/test-build-artifact
      with:
        archive: .build/bootstrap/${{ inputs.image }}/image.oci.tar
        receipt: .build/bootstrap/${{ inputs.image }}/build.json
        image: ${{ inputs.image }}
        architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
        revision: ${{ github.sha }}
        version: bootstrap
    - name: Qualify source runtime
      uses: ./workflow/test-candidate-runtime
      with:
        archive: .build/bootstrap/${{ inputs.image }}/image.oci.tar
        image: ${{ inputs.image }}
        architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
        revision: ${{ github.sha }}
        output: .build/bootstrap/${{ inputs.image }}/runtime.json
    - name: Transfer exact source candidate
      id: candidate
      uses: ./workflow/import-candidate-image
      with:
        archive: .build/bootstrap/${{ inputs.image }}/image.oci.tar
        repository: ${{ inputs.image }}
        host-port: ${{ inputs.host-port }}
    - name: Prepare immutable source action
      uses: ./workflow/new-candidate-action
      with:
        directory: ${{ inputs.directory }}
        image: ${{ steps.candidate.outputs.image }}
        destination: .source-actions/${{ inputs.directory }}

name: Get image matrix
description: Select native image qualification jobs from source metadata and changed paths
inputs:
  files:
    description: JSON array of changed paths
    default: '[]'
  full:
    description: Select all images
    default: 'false'
  event:
    description: GitHub event name
    required: true
  ref:
    description: Git ref being qualified
    required: true
  release-plan:
    description: Optional release plan JSON path
    default: ''
  reuse-artifacts:
    description: Skip builds after independent exact-source artifact validation
    default: 'false'
outputs:
  test-registry-image:
    description: Test registry service reference discovered from its action metadata
  mode:
    description: Development, prepare, release or maintenance mode
  matrix:
    description: Native image qualification matrix JSON
  has-work:
    description: Whether the matrix is nonempty
  version:
    description: Qualification version or release tag
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-get-image-matrix@sha256:700fc772e560cc84c84d4a7ead95d97975b35556d9ede7a981620d59fb8ca6e9
  args:
    - --files=${{ inputs.files }}
    - --full=${{ inputs.full }}
    - --event=${{ inputs.event }}
    - --ref=${{ inputs.ref }}
    - --release-plan=${{ inputs.release-plan }}
    - --reuse-artifacts=${{ inputs.reuse-artifacts }}

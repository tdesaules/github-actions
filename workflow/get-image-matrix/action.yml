name: Get image matrix
description: Select native image qualification jobs from source metadata and changed paths
inputs:
  application-definition:
    description: Optional public environment JSON for application Containerfiles under oci/
    default: ''
  output:
    description: Optional source-bound execution plan artifact path
    default: ''
  image:
    description: Restrict a reusable child chain to one discovered image
    default: ''
  files:
    description: JSON array of changed paths
    default: '[]'
  full:
    description: Select all images
    default: 'false'
  event:
    description: GitHub event name
    required: true
  ref:
    description: Git ref being qualified
    required: true
  release-plan:
    description: Optional release plan JSON path
    default: ''
  reuse-artifacts:
    description: Skip builds after independent exact-source artifact validation
    default: 'false'
  reuse-builds:
    description: Reuse successful source-equivalent development builds and requalify them
    default: 'false'
  repository:
    description: GitHub owner/repository for development build reuse
    default: ''
  token:
    description: Read-only Actions token for development build reuse
    default: ''
  before:
    description: Previous push commit for identifying affected qualification steps
    default: ''
outputs:
  images:
    description: Application mode functional or advisory subjects
  build_images:
    description: Application mode components to rebuild
  scan_only:
    description: Application mode advisory-only subjects
  reused:
    description: Application mode reused digests
  digests:
    description: Application mode published digests
  has_tests:
    description: Application mode test selection flag
  has_build:
    description: Application mode build selection flag
  platform:
    description: Application mode platform validation flag
  runtime-test:
    description: Whether selected work includes functional qualification
  image-matrix:
    description: One entry per selected image, independent of native architectures
  source-sha:
    description: Exact source commit used for selection
  test-registry-image:
    description: Test registry service reference discovered from its action metadata
  mode:
    description: Development, prepare, release or maintenance mode
  matrix:
    description: Native image qualification matrix JSON
  build-matrix:
    description: Required product builds and advisory reviewer dependencies only
  has-build:
    description: Whether the build matrix is nonempty
  has-work:
    description: Whether the matrix is nonempty
  version:
    description: Qualification version or release tag
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-get-image-matrix@sha256:c3a0c26de43f81fa867bb43c1042905ca753747aeb762b9c043be6a8529ea695
  env:
    APPLICATION_DEFINITION: ${{ inputs.application-definition }}
    MATRIX_OUTPUT: ${{ inputs.output }}
    MATRIX_IMAGE: ${{ inputs.image }}
    INPUT_TOKEN: ${{ inputs.token }}
    MATRIX_REUSE_BUILDS: ${{ inputs.reuse-builds }}
    INPUT_REPOSITORY: ${{ inputs.repository }}
    MATRIX_BEFORE: ${{ inputs.before }}
  args:
    - --files=${{ inputs.files }}
    - --full=${{ inputs.full }}
    - --event=${{ inputs.event }}
    - --ref=${{ inputs.ref }}
    - --release-plan=${{ inputs.release-plan }}
    - --reuse-artifacts=${{ inputs.reuse-artifacts }}

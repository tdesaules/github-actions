name: Get image matrix
description: Select native image qualification jobs from source metadata and changed paths
inputs:
  files:
    description: JSON array of changed paths
    default: '[]'
  full:
    description: Select all images
    default: 'false'
  event:
    description: GitHub event name
    required: true
  ref:
    description: Git ref being qualified
    required: true
  release-plan:
    description: Optional release plan JSON path
    default: ''
  reuse-artifacts:
    description: Skip builds after independent exact-source artifact validation
    default: 'false'
  reuse-builds:
    description: Reuse successful source-equivalent development builds and requalify them
    default: 'false'
  repository:
    description: GitHub owner/repository for development build reuse
    default: ''
  token:
    description: Read-only Actions token for development build reuse
    default: ''
  before:
    description: Previous push commit for identifying affected qualification steps
    default: ''
outputs:
  test-registry-image:
    description: Test registry service reference discovered from its action metadata
  mode:
    description: Development, prepare, release or maintenance mode
  matrix:
    description: Native image qualification matrix JSON
  build-matrix:
    description: Required product builds and advisory reviewer dependencies only
  has-build:
    description: Whether the build matrix is nonempty
  has-work:
    description: Whether the matrix is nonempty
  version:
    description: Qualification version or release tag
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-get-image-matrix@sha256:ad0df233844453fc21a493f87761468279651ad350dbb1e175dc0352baceb734
  env:
    INPUT_TOKEN: ${{ inputs.token }}
    MATRIX_REUSE_BUILDS: ${{ inputs.reuse-builds }}
    INPUT_REPOSITORY: ${{ inputs.repository }}
    MATRIX_BEFORE: ${{ inputs.before }}
  args:
    - --files=${{ inputs.files }}
    - --full=${{ inputs.full }}
    - --event=${{ inputs.event }}
    - --ref=${{ inputs.ref }}
    - --release-plan=${{ inputs.release-plan }}
    - --reuse-artifacts=${{ inputs.reuse-artifacts }}

name: Read Pantavisor published release
description: Read immutable publication references for maintenance without rebuilding
inputs:
  token: {description: GitHub token for release lookup, required: true}
outputs:
  has-release: {description: Whether a stable release exists}
  component: {description: Published component reference}
  image: {description: Published image reference when present}
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-read-pantavisor-published@sha256:46844efdc08cec166191c243cb04f0df39d99b79579a6834e12f2e805743ea26
  env:
    INPUT_TOKEN: ${{ inputs.token }}
  args: []

name: Test Pantavisor platform
description: Qualify System with pinned QEMU and export public reports separately from private fixtures
inputs:
  directory:
    description: System checkout
    default: .
  bundle:
    description: Verified assembled platform
    default: dist/platform
  output:
    description: New private qualification directory
    default: artifacts/qualification
  reports:
    description: New directory for public JSON and console reports
    default: artifacts/public-reports
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-test-pantavisor-platform@sha256:c5732bdda4d9d35332c515a76394a98ca01fcffb2776fbbabe5395149b1015c9
  args:
    - --directory=${{ inputs.directory }}
    - --bundle=${{ inputs.bundle }}
    - --output=${{ inputs.output }}
    - --reports=${{ inputs.reports }}

name: Test candidate runtime
description: Verify native OCI runtime, negative fixtures and read-only source permissions without an engine socket
inputs:
  archive-output:
    description: Optional native OCI archive retained for scanning a published reference without rebuilding
    default: ''
  archive:
    description: OCI build archive; empty to inspect the published reference
    default: ''
  reference:
    description: Immutable reference used only when archive is empty
    default: ''
  image:
    description: Expected image owner label
    required: true
  architecture:
    description: Native amd64 or arm64 architecture
    required: true
  revision:
    description: Optional expected build revision label
    default: ''
  output:
    description: Runtime test report JSON path
    required: true
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-test-candidate-runtime@sha256:e4db24b9c8cd0ed3058a7a3da1d68e6a08480312ef533b6fa8bb9544740fc66b
  env:
    INPUT_ARCHIVE-OUTPUT: ${{ inputs.archive-output }}
  args:
    - --archive=${{ inputs.archive }}
    - --reference=${{ inputs.reference }}
    - --image=${{ inputs.image }}
    - --architecture=${{ inputs.architecture }}
    - --revision=${{ inputs.revision }}
    - --output=${{ inputs.output }}

name: New candidate action
description: Prepare an action to use a candidate image without changing its source metadata
inputs:
  application-smoke:
    description: Fixed smoke definition for the bastion or provision runtime
    default: ''
  directory:
    description: Source action directory (unused with application-smoke)
    default: '.'
  image:
    description: Immutable registry digest or already loaded localhost candidate tag
    required: true
  destination:
    description: Separate destination directory for the generated action
    required: true
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-new-candidate-action@sha256:1c6e22f9394924b33d06dd09529f80dbf7d178ddbffc774dddaa6657f3b6f12b
  env:
    APP_SMOKE: ${{ inputs.application-smoke }}
  args:
    - --directory=${{ inputs.directory }}
    - --image=${{ inputs.image }}
    - --destination=${{ inputs.destination }}

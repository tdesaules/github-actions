name: New image metadata
description: Record checksums and platform evidence for an archive after its tests and scans succeed
inputs:
  archive:
    description: Exact tested OCI archive path
    required: true
  image:
    description: Component image name
    required: true
  architecture:
    description: Native amd64 or arm64 platform
    required: true
  revision:
    description: Full tested Git commit SHA
    required: true
  version:
    description: Candidate version identifier
    required: true
  output:
    description: Metadata JSON output path
    required: true
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-new-image-metadata@sha256:b388832587187de7dfe8c0d7569e625d88d3c2bc8b2cef89de86b30f8c8e12a7
  args:
    - --archive=${{ inputs.archive }}
    - --image=${{ inputs.image }}
    - --architecture=${{ inputs.architecture }}
    - --revision=${{ inputs.revision }}
    - --version=${{ inputs.version }}
    - --output=${{ inputs.output }}

name: Test catalog signatures
description: Verify every catalogue index and platform signature, including reused images and release tags
inputs:
  directory:
    description: Publication plan and signature evidence directory
    default: .build/publication
  repository:
    description: Repository whose main workflow signed the images
    required: true
  tag:
    description: Optional existing release tag to validate against the checkout
    default: ''
  registry-username:
    description: Optional GHCR username
    default: ''
  registry-password:
    description: Optional GHCR read token
    default: ''
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-test-catalog-signatures@sha256:d1eef13db254a145ecf238b29022c66e6162e824fbb610847a3885cb3c85b007
  env:
    INPUT_REGISTRY-USERNAME: ${{ inputs.registry-username }}
    INPUT_REGISTRY-PASSWORD: ${{ inputs.registry-password }}
  args:
    - --directory=${{ inputs.directory }}
    - --repository=${{ inputs.repository }}
    - --tag=${{ inputs.tag }}

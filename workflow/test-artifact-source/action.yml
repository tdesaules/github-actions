name: Test artifact source
description: Require a successful catalogue run at the exact main revision before artifact reuse
inputs:
  release-plan:
    description: Release plan defining the required image and architecture set
    default: ''
  run-id:
    description: Source GitHub Actions run ID
    required: true
  repository:
    description: Repository owner/name
    required: true
  revision:
    description: Exact source commit SHA
    required: true
  token:
    description: GitHub token with actions read permission
    required: true
outputs:
  artifact-ids:
    description: Immutable artifact IDs covering the required native builds across successful retries
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-test-artifact-source@sha256:bce831c6c0507aa8cbbfa4c7c61975e2bab1eb1be82da2cd95729926b9bcdfda
  env:
    INPUT_TOKEN: ${{ inputs.token }}
    INPUT_RELEASE-PLAN: ${{ inputs.release-plan }}
  args:
    - --run-id=${{ inputs.run-id }}
    - --repository=${{ inputs.repository }}
    - --revision=${{ inputs.revision }}

name: Prepare qualified source release
description: Verify receipts and atomically publish changelog commit and annotated tag
inputs:
  directory:
    description: Trusted consumer checkout relative to the workspace
    default: .
  token:
    description: Shared bot App installation token
    required: true
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-prepare-chezmoi-release@sha256:661e335f2b4cfbec17275beaecacc50614f63bdc28331c535e71c9a2f0beeb52
  env:
    CI_TOKEN: ${{ inputs.token }}
    INPUT_DIRECTORY: ${{ inputs.directory }}

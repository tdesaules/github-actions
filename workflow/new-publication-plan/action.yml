name: New publication plan
description: Validate exact-source tested archives and plan digest-preserving catalogue publication
inputs:
  image:
    description: Optional single discovered image to prepare for publication
    default: ''
  receipts:
    description: Directory of published per-image receipts to aggregate
    default: ''
  directory:
    description: Downloaded qualification artifact directory
    default: .build/publication
  owner:
    description: GitHub registry owner
    required: true
  release-plan:
    description: Release plan path; empty requires full bootstrap qualification
    default: ''
runs:
  using: docker
  env:
    PUBLICATION_IMAGE: ${{ inputs.image }}
    PUBLICATION_RECEIPTS: ${{ inputs.receipts }}
  image: docker://ghcr.io/tdesaules/github-actions/workflow-new-publication-plan@sha256:bb776409ce9be20c2c57a19a8abb6a3802cedda3ccfe69ddad1eae8bedf3137d
  args:
    - --directory=${{ inputs.directory }}
    - --owner=${{ inputs.owner }}
    - --release-plan=${{ inputs.release-plan }}

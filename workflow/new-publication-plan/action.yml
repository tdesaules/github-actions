name: New publication plan
description: Validate exact-source tested archives and plan digest-preserving catalogue publication
inputs:
  directory:
    description: Downloaded qualification artifact directory
    default: .build/publication
  owner:
    description: GitHub registry owner
    required: true
  release-plan:
    description: Release plan path; empty requires full bootstrap qualification
    default: ''
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-new-publication-plan@sha256:5972172cb0eec7e08cf2b4f8a14e9acd98582fcc6128d9a215e08935f72f7f8e
  args:
    - --directory=${{ inputs.directory }}
    - --owner=${{ inputs.owner }}
    - --release-plan=${{ inputs.release-plan }}

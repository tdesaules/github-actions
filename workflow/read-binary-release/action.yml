name: Read binary release
description: Verify annotated release provenance and download exact immutable qualified artifacts
inputs:
  tag:
    description: Stable annotated release tag
    required: true
  repository:
    description: GitHub owner/repository
    required: true
  token:
    description: Token with contents read and actions read
    required: true
  output:
    description: New workspace directory for downloaded qualified archives
    default: .build/released
outputs:
  source_sha:
    description: Original qualified source commit
  version:
    description: Release version
  run_id:
    description: Original preparation run
  run_attempt:
    description: Original preparation run attempt
  qualified_directory:
    description: Root qualified directory
  amd64_directory:
    description: AMD64 artifact directory
  arm64_directory:
    description: ARM64 artifact directory
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-read-binary-release@sha256:befc523ec1448bd6a0ee446fcc74cb9a6a0ae64aaa888e778610504312d2e83f
  env:
    INPUT_TAG: ${{ inputs.tag }}
    INPUT_REPOSITORY: ${{ inputs.repository }}
    INPUT_TOKEN: ${{ inputs.token }}
    INPUT_OUTPUT: ${{ inputs.output }}

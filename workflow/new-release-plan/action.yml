name: New release plan
description: Plan a stable semantic release with Git and git-cliff without publishing refs
inputs:
  config:
    description: git-cliff configuration path
    default: cliff.toml
  output:
    description: Release plan JSON path
    default: .build/publication/release-plan.json
outputs:
  release-version:
    description: Planned stable semantic version
  release-changed:
    description: Whether a new release is needed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-new-release-plan@sha256:ab7b7e967eb0d4a8f1d6b3616b58219da0d1a962ab58717e12475d79d1603a5e
  args:
    - --config=${{ inputs.config }}
    - --output=${{ inputs.output }}

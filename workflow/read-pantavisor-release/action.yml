name: Read Pantavisor release
description: Validate tag provenance and successful preparation before downloading its qualified artifact
inputs:
  token: {description: GitHub token with actions read permission, required: true}
outputs:
  run-id: {description: Successful preparation run}
  artifact-id: {description: Exact retained qualified artifact ID}
  receipt-digest: {description: Expected receipt SHA-256 recorded by the tag}
  version: {description: Release version}
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-read-pantavisor-release@sha256:3590ecf6130360626526fcf7a816dd928deea002bb53929c3fd6067033e5ac1e
  env:
    INPUT_TOKEN: ${{ inputs.token }}
  args: []

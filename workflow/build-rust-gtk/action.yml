name: Build Rust GTK binary candidate
description: Build native niri-tonic-files and package an untested reproducible archive
inputs:
  directory:
    description: Application checkout
    default: .
  version:
    description: Stable SemVer compiled into the binary
    required: true
  source-sha:
    description: Full source commit SHA
    required: true
  arch:
    description: Native amd64 or arm64
    required: true
  output:
    description: Candidate directory relative to workspace
    default: .build/candidate
outputs:
  archive:
    description: Candidate archive workspace path
  receipt:
    description: Untested receipt workspace path
  sha256:
    description: Candidate archive checksum
runs:
  using: docker
  image: Containerfile
  args:
    - --directory=${{ inputs.directory }}
    - --version=${{ inputs.version }}
    - --source-sha=${{ inputs.source-sha }}
    - --arch=${{ inputs.arch }}
    - --output=${{ inputs.output }}

name: Build Pantavisor
description: Build the fixed KAS CI target and stage provenance-bound deploy files
inputs:
  directory:
    description: Project checkout
    default: .
  project:
    description: core, k0s or system
    required: true
  cold:
    description: Require a new build directory; false permits explicit local diagnostic recovery
    default: 'true'
outputs:
  deploy-directory:
    description: Staged deploy directory relative to the project
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-build-pantavisor@sha256:aeeb3b43468a228b396bdf8ac353a78dfb4c997e54d99c69ae8aff5e890fe4dd
  args:
    - --directory=${{ inputs.directory }}
    - --project=${{ inputs.project }}
    - --cold=${{ inputs.cold }}

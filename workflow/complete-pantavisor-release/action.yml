name: Complete Pantavisor release
description: Push the qualified candidate commit and annotated provenance tag atomically without rewriting main
inputs:
  directory: {description: Candidate bundle and metadata directory, default: artifacts/release}
  receipt: {description: Qualified artifact receipt, default: artifacts/qualified-receipt.json}
  artifact-id: {description: Exact uploaded qualified artifact ID recorded in the tag, required: true}
  token: {description: Release App token with contents and workflow permissions, required: true}
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-complete-pantavisor-release@sha256:b982cde11f75e6632c750ef8d6cf70146cee0479493b3a54832d794b845f9ab7
  env:
    INPUT_TOKEN: ${{ inputs.token }}
  args:
    - --directory=${{ inputs.directory }}
    - --receipt=${{ inputs.receipt }}
    - --artifact-id=${{ inputs.artifact-id }}

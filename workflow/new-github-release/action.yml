name: New GitHub release
description: Create an idempotent GitHub Release for an already verified existing SemVer tag
inputs:
  repository:
    description: GitHub owner/repository
    required: true
  tag:
    description: Verified existing release tag
    required: true
  notes:
    description: Release notes file
    default: CHANGELOG.md
  token:
    description: GitHub token with contents write permission
    required: true
outputs:
  created:
    description: Whether a new release was created
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-new-github-release@sha256:486387402cd0be9240c78137f93c782e48ec98829f7fba3f74146d15c2675f79
  env:
    INPUT_TOKEN: ${{ inputs.token }}
  args:
    - --repository=${{ inputs.repository }}
    - --tag=${{ inputs.tag }}
    - --notes=${{ inputs.notes }}

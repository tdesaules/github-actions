name: Test step outcomes
description: Assert expected negative action outcomes and absence of invalid success outputs
inputs:
  outcomes:
    description: GitHub steps context serialized as JSON
    required: true
  expected-failures:
    description: JSON array of step IDs that must have failed
    default: '[]'
  absent-files:
    description: JSON array of output paths that must not exist
    default: '[]'
outputs:
  verified:
    description: Whether all assertions passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-test-step-outcomes@sha256:f50a0c8a6fe8d37b9bd65c2f078b3298ad66e96627b4323012256786db55f0ec
  # Preserve nested JSON/backslashes without the runner's Docker argv quoting.
  # The pinned executable already reads these exact environment defaults.
  env:
    INPUT_OUTCOMES: ${{ inputs.outcomes }}
    INPUT_EXPECTED-FAILURES: ${{ inputs.expected-failures }}
    INPUT_ABSENT-FILES: ${{ inputs.absent-files }}

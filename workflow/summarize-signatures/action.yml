name: Summarize advisory signatures
description: Record actual signing and subject-bound verification outcomes without a security gate
inputs:
  subject:
    description: Immutable GHCR image or artifact reference
    required: true
  sign-outcome:
    description: Actual signing step outcome
    default: skipped
  signed:
    description: Actual signing action signed output
    default: 'false'
  verify-outcome:
    description: Actual verification step outcome
    default: skipped
  report:
    description: Cosign verification JSON report path
  output:
    description: Workspace-relative durable summary path
    default: .build/security/signatures.json
outputs:
  report:
    description: Subject-bound advisory status report
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-summarize-signatures@sha256:b38e4a59cca845e4b7fa0cfa0aa2c191a6e33fea15fa028247043ac84b09e09d
  args:
    - --subject=${{ inputs.subject }}
    - --sign-outcome=${{ inputs.sign-outcome }}
    - --signed=${{ inputs.signed }}
    - --verify-outcome=${{ inputs.verify-outcome }}
    - --report=${{ inputs.report }}
    - --output=${{ inputs.output }}

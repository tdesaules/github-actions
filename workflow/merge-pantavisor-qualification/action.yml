name: Merge Pantavisor qualification
description: Require base and k0s qualification of identical System artifacts before finalization
inputs:
  base: {description: Base profile receipt, default: artifacts/qualified-receipt.json}
  k0s: {description: k0s profile receipt, default: artifacts/profile-k0s/qualified-receipt.json}
  revision: {description: Expected source revision, required: true}
  output: {description: Combined qualification receipt, default: artifacts/qualified-receipt.json}
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-merge-pantavisor-qualification@sha256:bf982313dd2a4ac2d00175b2ac390b2f51c4d9d6b551f4edaf2cd7e5bdbb9564
  args:
    - --base=${{ inputs.base }}
    - --k0s=${{ inputs.k0s }}
    - --revision=${{ inputs.revision }}
    - --output=${{ inputs.output }}

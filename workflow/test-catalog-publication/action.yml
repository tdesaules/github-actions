name: Test catalog publication
description: Validate release tag provenance and exact published index/platform references without signature gating
inputs:
  tag:
    description: Existing SemVer release tag matching the checkout
    required: true
  registry-username:
    description: Optional registry username
    default: ''
  registry-password:
    description: Optional registry read token
    default: ''
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-test-catalog-publication@sha256:a51ffcb832efbf3c1cec9247173db1ff9d86e87b127f5e76f75f2b92151408f2
  env:
    INPUT_REGISTRY-USERNAME: ${{ inputs.registry-username }}
    INPUT_REGISTRY-PASSWORD: ${{ inputs.registry-password }}
  args:
    - --tag=${{ inputs.tag }}

name: New Pantavisor candidate
description: Prepare a versioned candidate commit and portable Git bundle from main without pushing
inputs:
  output: {description: Candidate bundle and metadata directory, default: artifacts/release}
  project: {description: core or k0s or system, required: true}
outputs:
  changed: {description: Whether Conventional Commits require a release}
  revision: {description: Exact candidate commit to build and qualify}
  version: {description: Candidate VERSION}
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-new-pantavisor-candidate@sha256:61a62f5669db8522b9b1dc19af8081e8513c0835e0ee8f4b7fba2b3417d80181
  args:
    - --output=${{ inputs.output }}
    - --project=${{ inputs.project }}

name: Test reviewed vulnerabilities
description: Report candidate vulnerabilities without severity gating and retain database evidence
inputs:
  sbom:
    description: Syft JSON candidate SBOM
    required: true
  config:
    description: Evidence-derived Grype configuration; empty scans without exclusions
    default: ''
  output:
    description: Grype JSON report path
    required: true
  database-metadata:
    description: Exact Grype database snapshot metadata path
    required: true
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-test-reviewed-vulnerabilities@sha256:3f7073e05ff591a7b0856e734332b223f114be2a14b15b13bf749a868403fa17
  args:
    - --sbom=${{ inputs.sbom }}
    - --config=${{ inputs.config }}
    - --output=${{ inputs.output }}
    - --database-metadata=${{ inputs.database-metadata }}

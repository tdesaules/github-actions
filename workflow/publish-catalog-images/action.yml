name: Publish catalog images
description: Publish exact tested archives and verify immutable platform and index digests
inputs:
  directory:
    description: Validated publication plan directory
    default: .build/publication
  registry-username:
    description: GHCR username
    required: true
  registry-password:
    description: GHCR write token
    required: true
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-publish-catalog-images@sha256:c247f6614aa84ea29566694d65754d97f39c401b6493342e056b6549c81e4db4
  env:
    INPUT_REGISTRY-USERNAME: ${{ inputs.registry-username }}
    INPUT_REGISTRY-PASSWORD: ${{ inputs.registry-password }}
  args:
    - --directory=${{ inputs.directory }}

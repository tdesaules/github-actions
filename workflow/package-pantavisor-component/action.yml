name: Package Pantavisor component
description: Export a provenance-bound producer rootfs without rebuilding
inputs:
  directory:
    description: Producer checkout
    default: .
  deploy-directory:
    description: Staged KAS deploy files
    default: artifacts/ci/deploy
  output:
    description: New public component directory
    default: dist/component
outputs:
  component:
    description: Export directory relative to the project
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-package-pantavisor-component@sha256:dbfbe606a71d54b7cc8fc0eadd4dee06663b43fdddc9cc3d413bc0be96446bf5
  args:
    - --directory=${{ inputs.directory }}
    - --deploy-directory=${{ inputs.deploy-directory }}
    - --output=${{ inputs.output }}

name: New Pantavisor GitHub release
description: Publish a retry-safe GitHub Release linking the qualified source to immutable component and image digests
inputs:
  receipt: {description: Qualified receipt, default: artifacts/qualified-receipt.json}
  receipt-digest: {description: Expected receipt SHA-256 from the annotated tag, required: true}
  component: {description: Published immutable component reference, required: true}
  image: {description: Published immutable image reference for producers, default: ''}
  token: {description: GitHub token with contents write permission, required: true}
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-new-pantavisor-github-release@sha256:7a7be2a887a0c802950ecfb5f9dbd904f43ed821a85302c9bb37e26ebfce926d
  env:
    INPUT_TOKEN: ${{ inputs.token }}
  args:
    - --receipt=${{ inputs.receipt }}
    - --receipt-digest=${{ inputs.receipt-digest }}
    - --component=${{ inputs.component }}
    - --image=${{ inputs.image }}

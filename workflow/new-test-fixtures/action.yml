name: New test fixtures
description: Generate deterministic OCI archives and valid and invalid source fixtures for action qualification
inputs:
  directory:
    description: Destination directory for generated fixtures
    required: true
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-new-test-fixtures@sha256:1a8a6fb3a91c394027950f56050149d0447fa8b34dcdf0547ec0b0b9a16f4296
  args:
    - --directory=${{ inputs.directory }}

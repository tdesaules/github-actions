name: Complete release
description: Commit verified image digests and changelog, then atomically push main and a new release tag
inputs:
  directory:
    description: Verified publication journal and release plan directory
    default: .build/publication
  token:
    description: Release App token with contents and workflow update permissions
    required: true
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-complete-release@sha256:b63a7db79b4d37251affa5adaa66aac15035e8f02923f2308127b0ba3cbe2a70
  env:
    INPUT_TOKEN: ${{ inputs.token }}
  args:
    - --directory=${{ inputs.directory }}

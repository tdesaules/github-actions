name: Complete release
description: Commit verified image digests and changelog, then atomically push main and a new release tag
inputs:
  application-version:
    description: Stable version for an annotated application source tag
    default: ''
  application-digests:
    description: JSON map of verified published application digests
    default: ''
  application-reused:
    description: JSON map of requalified unchanged application digests
    default: ''
  directory:
    description: Verified publication journal and release plan directory
    default: .build/publication
  token:
    description: Release App token with contents and workflow update permissions
    required: true
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/workflow-complete-release@sha256:fb39f24012b49150b817a6ba0c315b4297f02c7c6dbb7040b2e420436aec28be
  env:
    VERSION: ${{ inputs.application-version }}
    APP_DIGESTS: ${{ inputs.application-digests }}
    REUSED_DIGESTS: ${{ inputs.application-reused }}
    INPUT_TOKEN: ${{ inputs.token }}
  args:
    - --directory=${{ inputs.directory }}

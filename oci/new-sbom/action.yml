name: New SBOM
description: Generate a Syft SBOM from an OCI archive, layout, registry image or rootfs
inputs:
  source:
    description: 'Explicit oci-archive:, oci-dir:, registry: or dir: source'
    required: true
  format:
    description: spdx-json, cyclonedx-json or evidence-rich syft-json
    default: spdx-json
  output:
    description: SBOM output path
    default: sbom.spdx.json
outputs:
  sbom:
    description: Generated SBOM path
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/oci-new-sbom@sha256:ba17965a3467c2ac220f09409ed1c5c3e54f54483e8021ed7ad4c0af9a52f938
  args:
    - --source=${{ inputs.source }}
    - --format=${{ inputs.format }}
    - --output=${{ inputs.output }}

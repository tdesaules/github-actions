name: Merge OCI image index
description: Assemble two tested OCI archives and publish the index and children by digest
inputs:
  sources:
    description: JSON array of amd64 and arm64 OCI archive paths
    required: true
  destination:
    description: docker://registry/repository without a tag or digest
    required: true
  output:
    description: Exact published index manifest JSON
    default: image-index.json
  registry:
    description: Registry hostname
    default: ghcr.io
  registry-username:
    description: Registry username
  registry-password:
    description: Registry token
outputs:
  image:
    description: Published digest-qualified image reference
  digest:
    description: SHA-256 of the exact index manifest
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/oci-merge-image-index@sha256:b0505a1586ad1e3d7e96abc9fbffb7cf3f9cca063690c41dfaeecc7cc7a8b8ee
  args:
    - --sources=${{ inputs.sources }}
    - --destination=${{ inputs.destination }}
    - --output=${{ inputs.output }}
    - --registry=${{ inputs.registry }}
    - --registry-username=${{ inputs.registry-username }}
  env:
    INPUT_REGISTRY-PASSWORD: ${{ inputs.registry-password }}

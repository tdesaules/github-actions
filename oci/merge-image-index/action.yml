name: Merge OCI image index
description: Publish an index for two tested archives whose exact children are already in the destination repository
inputs:
  sources:
    description: JSON array of amd64 and arm64 OCI archive paths
    required: true
  destination:
    description: Registry destination prefixed with docker://
    required: true
  registry:
    description: Registry hostname
    default: ghcr.io
  registry-username:
    description: Registry username
  registry-password:
    description: Registry token
runs:
  using: composite
  steps:
    - id: builder
      shell: bash
      env:
        BUILDER_IMAGE: docker://ghcr.io/tdesaules/github-actions/buildah@sha256:d62d7e41de4afd83b4d73fbe49dc60255caf7d0f2c5079e85e4e2da585bffdb7
        BUILDER_OPERATION: merge-image-index
        BUILDER_INPUTS: ${{ toJSON(inputs) }}
      run: python3 "$GITHUB_ACTION_PATH/../../shared/run-builder.py"

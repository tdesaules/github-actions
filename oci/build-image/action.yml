name: Build OCI image
description: Build with containerized Buildah and export an OCI archive
inputs:
  context:
    description: Build context relative to the workspace
    default: .
  containerfile:
    description: Containerfile path
    default: Containerfile
  image:
    description: Image name without a tag
    required: true
  version:
    description: Integration image version without a v prefix
    required: true
  platform:
    description: linux/amd64 or linux/arm64 (requires a matching runner)
    required: true
  target:
    description: Optional build stage
  labels:
    description: JSON object of OCI labels
    default: '{}'
  build-args:
    description: JSON object of non-secret build arguments
    default: '{}'
  secrets:
    description: JSON array of id=NAME,src=PATH secret specifications
    default: '[]'
  output:
    description: Output archive path in the workspace
    default: image.oci.tar
outputs:
  archive:
    description: Absolute archive path inside the workspace mount
    value: ${{ steps.builder.outputs.archive }}
  archive-sha256:
    description: SHA-256 of the archive file, not the image manifest
    value: ${{ steps.builder.outputs.archive-sha256 }}
runs:
  using: composite
  steps:
    - id: builder
      shell: bash
      env:
        BUILDER_IMAGE: docker://ghcr.io/tdesaules/github-actions/oci-build-image@sha256:5900ebe41f45caf4124a4250c1ec97255ccd5be7683700d8874d97f278e06a23
        INPUT_CONTEXT: ${{ inputs.context }}
        INPUT_CONTAINERFILE: ${{ inputs.containerfile }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_LABELS: ${{ inputs.labels }}
        INPUT_BUILD_ARGS: ${{ inputs.build-args }}
        INPUT_SECRETS: ${{ inputs.secrets }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        exec docker run --rm \
          --security-opt=seccomp=unconfined --security-opt=apparmor=unconfined \
          -v "$GITHUB_WORKSPACE:/github/workspace" \
          -v "$GITHUB_OUTPUT:/github/output" \
          -w /github/workspace -e GITHUB_OUTPUT=/github/output \
          "${BUILDER_IMAGE#docker://}" \
          "--context=$INPUT_CONTEXT" "--containerfile=$INPUT_CONTAINERFILE" \
          "--image=$INPUT_IMAGE" "--version=$INPUT_VERSION" \
          "--platform=$INPUT_PLATFORM" "--target=$INPUT_TARGET" \
          "--labels=$INPUT_LABELS" "--build-args=$INPUT_BUILD_ARGS" \
          "--secrets=$INPUT_SECRETS" "--output=$INPUT_OUTPUT"

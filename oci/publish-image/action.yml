name: Publish OCI image
description: Publish a previously tested archive or layout preserving its digests
inputs:
  source:
    description: 'Explicit oci-archive: or oci: source'
    required: true
  destination:
    description: Registry destination prefixed with docker://
    required: true
  registry:
    description: Registry hostname for authentication
    default: ghcr.io
  registry-username:
    description: Registry username
  registry-password:
    description: Registry token (use a secret)
outputs:
  destination:
    description: Published transport reference
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/oci-publish-image@sha256:d53218ec5ad54fccf9d0b70ffc3147c2f114a932d7916e04eb0acc0a5d6f1e0b
  args:
    - --source=${{ inputs.source }}
    - --destination=${{ inputs.destination }}
    - --registry=${{ inputs.registry }}
    - --registry-username=${{ inputs.registry-username }}
    - --registry-password=${{ inputs.registry-password }}

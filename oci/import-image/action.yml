name: Import OCI image
description: Import an OCI archive into an OCI layout without a host engine socket
inputs:
  source:
    description: 'Explicit oci-archive: source'
    required: true
  destination:
    description: 'Explicit oci: layout destination'
    required: true
outputs:
  destination:
    description: Resulting destination transport reference
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/oci-import-image@sha256:347c1a6a8d65e80ea758d860af1a10ea0b949fccbdb226042733bb927bc02a97
  args:
    - --source=${{ inputs.source }}
    - --destination=${{ inputs.destination }}

name: Get OCI image digest
description: Read the raw manifest or multiarchitecture index digest from a registry
inputs:
  image:
    description: Registry image reference
    required: true
  expected-digest:
    description: Optional expected sha256 digest
  registry:
    description: Registry hostname
    default: ghcr.io
  registry-username:
    description: Registry username
  registry-password:
    description: Registry token
outputs:
  digest:
    description: Raw manifest or index digest
  reference:
    description: Digest-qualified image reference
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/oci-get-image-digest@sha256:095b71ff50d4d3de72915c5e94b998c7a9c373336412c712858b8ae7936ce818
  args:
    - --image=${{ inputs.image }}
    - --expected-digest=${{ inputs.expected-digest }}
    - --registry=${{ inputs.registry }}
    - --registry-username=${{ inputs.registry-username }}
    - --registry-password=${{ inputs.registry-password }}

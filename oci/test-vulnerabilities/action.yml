name: Test vulnerabilities
description: Scan an existing SBOM with Grype and retain a machine-readable report
inputs:
  sbom:
    description: Existing SBOM path
    required: true
  fail-on:
    description: Legacy exit threshold; none reports findings without a severity gate
    default: high
  update-database:
    description: Update the database before scanning; false requires a valid cached database
    default: 'true'
  output:
    description: JSON report path
    default: grype.json
outputs:
  report:
    description: Report path, including on threshold failure
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/oci-test-vulnerabilities@sha256:7a5b2f93d78f18202fbab6ca41dc3491f28df63f3f9d40b78f2c3ed3d3146772
  args:
    - --sbom=${{ inputs.sbom }}
    - --fail-on=${{ inputs.fail-on }}
    - --update-database=${{ inputs.update-database }}
    - --output=${{ inputs.output }}

name: Test vulnerabilities
description: Scan an existing SBOM with Grype and retain a machine-readable report
inputs:
  sbom:
    description: Existing SBOM path
    required: true
  fail-on:
    description: negligible, low, medium, high or critical
    default: high
  update-database:
    description: Update the database before scanning; false requires a valid cached database
    default: 'true'
  output:
    description: JSON report path
    default: grype.json
outputs:
  report:
    description: Report path, including on threshold failure
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/oci-test-vulnerabilities@sha256:22c73b1ac3c57a61820442b4947e6ab42de6c524cc6fb1e074948b128dd91745
  args:
    - --sbom=${{ inputs.sbom }}
    - --fail-on=${{ inputs.fail-on }}
    - --update-database=${{ inputs.update-database }}
    - --output=${{ inputs.output }}

name: Export OCI image
description: Copy an OCI layout or registry image into an OCI archive without changing digests
inputs:
  source:
    description: 'Explicit oci:, oci-archive: or docker:// source'
    required: true
  destination:
    description: 'Explicit oci-archive: destination'
    required: true
outputs:
  destination:
    description: Resulting destination transport reference
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/oci-export-image@sha256:99dd4e3ec2352f60c6ef469e64dfb631aebce850d16f2822b69a7c1660267e2c
  args:
    - --source=${{ inputs.source }}
    - --destination=${{ inputs.destination }}

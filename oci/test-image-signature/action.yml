name: Test OCI image signature
description: Verify an immutable image signature with exact identity and issuer constraints
inputs:
  image:
    description: Image reference qualified by sha256 digest
    required: true
  identity:
    description: Exact expected keyless certificate identity
  issuer:
    description: Expected OIDC issuer
  key:
    description: Optional public key path for key-based verification
  transparency-log:
    description: Require transparency-log verification; false requires an explicit public key
    default: 'true'
  output:
    description: Verification report path
    default: cosign.json
  registry:
    description: Registry hostname
    default: ghcr.io
  registry-username:
    description: Registry username
  registry-password:
    description: Registry token
outputs:
  report:
    description: Verification report path
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/oci-test-image-signature@sha256:281a09b7e04f1aa95da0703a99178e33c6d3484e3804e0fb50cf41d6d91885fc
  args:
    - --image=${{ inputs.image }}
    - --identity=${{ inputs.identity }}
    - --issuer=${{ inputs.issuer }}
    - --key=${{ inputs.key }}
    - --transparency-log=${{ inputs.transparency-log }}
    - --output=${{ inputs.output }}
    - --registry=${{ inputs.registry }}
    - --registry-username=${{ inputs.registry-username }}
    - --registry-password=${{ inputs.registry-password }}

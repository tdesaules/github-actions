name: Test Go
description: Run the Go test suite in an independent container
inputs:
  directory:
    description: Go module directory relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-go@sha256:1516ef12c06919942d06988d90428d17cc9d98c42a57efd497bb3f4a2e356330
  args:
    - --directory=${{ inputs.directory }}

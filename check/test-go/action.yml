name: Test Go
description: Run the Go test suite in an independent container
inputs:
  directory:
    description: Go module directory relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-go@sha256:1234c4e21b069c4cc6d03a74906acef258f05d3e0b7f3c5d62b9c08fd06ae497
  args:
    - --directory=${{ inputs.directory }}

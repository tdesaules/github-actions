name: Test Go
description: Run the Go test suite in an independent container
inputs:
  directory:
    description: Go module directory relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-go@sha256:bf97dc9becf7162c7f4685c956cf66f884ede7b6cc9b7c7fda9ebdc5c31e704e
  args:
    - --directory=${{ inputs.directory }}

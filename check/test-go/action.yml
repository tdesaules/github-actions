name: Test Go
description: Run the Go test suite in an independent container
inputs:
  directory:
    description: Go module directory relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-go@sha256:57302e8c405072dd87a7ce537e7542bf7aa726c1f9fa9ba85579dc0ad21d2137
  args:
    - --directory=${{ inputs.directory }}

name: Test Go
description: Run the Go test suite in an independent container
inputs:
  directory:
    description: Go module directory relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-go@sha256:9005898d96ef5d2f3e7c77a161c5f2630a74719309f45577fa88c6f3147ec156
  args:
    - --directory=${{ inputs.directory }}

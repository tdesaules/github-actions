name: Test Go
description: Run the Go test suite in an independent container
inputs:
  directory:
    description: Go module directory relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-go@sha256:3f7234267b85b2cd73fe213ce61b65b8e58f29a87f668fad154359296856ac44
  args:
    - --directory=${{ inputs.directory }}

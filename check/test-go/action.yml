name: Test Go
description: Run the Go test suite in an independent container
inputs:
  directory:
    description: Go module directory relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-go@sha256:6192ccee5cf04de360562cf058f5ac9e69e90af9b61ead0baf0fb8573ad935eb
  args:
    - --directory=${{ inputs.directory }}

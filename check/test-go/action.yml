name: Test Go
description: Run the Go test suite in an independent container
inputs:
  directory:
    description: Go module directory relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-go@sha256:cfb6c60e322eff1e9f9aaf8730f847dc0fafd228ec5567ee795872e4603cd256
  args:
    - --directory=${{ inputs.directory }}

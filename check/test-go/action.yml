name: Test Go
description: Run the Go test suite in an independent container
inputs:
  directory:
    description: Go module directory relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-go@sha256:8229b88e727d817a42b2d1d9b6c9dd3d4ccc43eb5d2a45a94cc096df1c4897b5
  args:
    - --directory=${{ inputs.directory }}

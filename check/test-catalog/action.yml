name: Test Catalog
description: Validate image ownership, pinned bases and scratch final stages
inputs:
  directory:
    description: Catalogue root relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-catalog@sha256:d11c613626a3eed43d51b5a0c6a160499143aaddcd42c20c2430ddcb300618d9
  args:
    - --directory=${{ inputs.directory }}

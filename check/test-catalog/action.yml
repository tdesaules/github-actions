name: Test Catalog
description: Validate image ownership, pinned bases and scratch final stages
inputs:
  directory:
    description: Catalogue root relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-catalog@sha256:efb76fa31ccb56e83700bb0d7345e534a52e257d68e43149a5196a50bc266108
  args:
    - --directory=${{ inputs.directory }}

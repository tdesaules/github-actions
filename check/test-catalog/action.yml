name: Test Catalog
description: Validate image ownership, pinned bases and scratch final stages
inputs:
  directory:
    description: Catalogue root relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-catalog@sha256:75832cf0671b540295995ff3619821afb0d115ac53ee010a0bd9b5f8faa99236
  args:
    - --directory=${{ inputs.directory }}

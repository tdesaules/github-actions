name: Test Catalog
description: Validate image ownership, pinned bases and scratch final stages
inputs:
  directory:
    description: Catalogue root relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-catalog@sha256:43437434155e9af7e795f5a620e1507cba2eef121612c27b823b89f9a424b115
  args:
    - --directory=${{ inputs.directory }}

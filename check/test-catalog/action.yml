name: Test Catalog
description: Validate image ownership, pinned bases and scratch final stages
inputs:
  directory:
    description: Catalogue root relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-catalog@sha256:7b0001f4a66d249c13f69e4136cec010178603ef2025a24a889d718e13e035e1
  args:
    - --directory=${{ inputs.directory }}

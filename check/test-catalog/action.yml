name: Test Catalog
description: Validate image ownership, pinned bases and scratch final stages
inputs:
  allow-source:
    description: Allow explicitly unpublished owned source during bootstrap qualification (never release tags)
    default: 'false'
  directory:
    description: Catalogue root relative to the workspace
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-catalog@sha256:e9a83824cef2d974bb8e427d522b71f46532ddd426c7e4891b26a717b74ad275
  args:
    - --allow-source=${{ inputs.allow-source }}
    - --directory=${{ inputs.directory }}

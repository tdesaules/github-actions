name: Test action metadata
description: Validate catalogue action contracts and container ownership
inputs:
  files:
    description: Nonempty JSON array of action metadata paths
    required: true
outputs:
  checked:
    description: Number of checked files
  passed:
    description: Whether every file passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-action-metadata@sha256:9a9b0fa9360f1fd6f4cf08233dba94ad6017f004aad9c98b19ca5d5e6f60c313
  args:
    - --files=${{ inputs.files }}

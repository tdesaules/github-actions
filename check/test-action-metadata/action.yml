name: Test action metadata
description: Validate catalogue action contracts and container ownership
inputs:
  files:
    description: Nonempty JSON array of action metadata paths
    required: true
outputs:
  checked:
    description: Number of checked files
  passed:
    description: Whether every file passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-action-metadata@sha256:6ee1b614f4ab1fc0ca73d525f465fcdfc5770a56d3ea58b895e026eb28edf683
  args:
    - --files=${{ inputs.files }}

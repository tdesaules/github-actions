name: Test action metadata
description: Validate catalogue action contracts and container ownership
inputs:
  files:
    description: Nonempty JSON array of action metadata paths
    required: true
outputs:
  checked:
    description: Number of checked files
  passed:
    description: Whether every file passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-action-metadata@sha256:9992a4ad55a600f53d39009d182233da8e9f688300f7674b52f908f8cb7df9a6
  args:
    - --files=${{ inputs.files }}

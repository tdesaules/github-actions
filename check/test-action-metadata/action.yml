name: Test action metadata
description: Validate catalogue action contracts and container ownership
inputs:
  files:
    description: Nonempty JSON array of action metadata paths
    required: true
outputs:
  checked:
    description: Number of checked files
  passed:
    description: Whether every file passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-action-metadata@sha256:94f6eb4acfff5aed977ab5dd636e03c2ed9ebcbaf7148a1cbe5cd7a9d7020843
  args:
    - --files=${{ inputs.files }}

name: Test action metadata
description: Validate catalogue action contracts and container ownership
inputs:
  files:
    description: Nonempty JSON array of action metadata paths
    required: true
outputs:
  checked:
    description: Number of checked files
  passed:
    description: Whether every file passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-action-metadata@sha256:624af1ab83fd8ed74952e911a5533d6b0c6ec1f570e9ccbe9673a5ab1a4dcfbf
  args:
    - --files=${{ inputs.files }}

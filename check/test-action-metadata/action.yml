name: Test action metadata
description: Validate catalogue action contracts and container ownership
inputs:
  files:
    description: Nonempty JSON array of action metadata paths
    required: true
outputs:
  checked:
    description: Number of checked files
  passed:
    description: Whether every file passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-action-metadata@sha256:476522d065d4dc8e09f2f3639a63fa0a9a5c331e4b7b1bf8436432d5cbbbfde5
  args:
    - --files=${{ inputs.files }}

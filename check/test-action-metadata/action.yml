name: Test action metadata
description: Validate catalogue action contracts and container ownership
inputs:
  files:
    description: Nonempty JSON array of action metadata paths
    required: true
outputs:
  checked:
    description: Number of checked files
  passed:
    description: Whether every file passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-action-metadata@sha256:9ee3e7116cee7b718862ebe01b2990ca7f6f5a6ea58b90feb3838ce9a1943276
  args:
    - --files=${{ inputs.files }}

name: Test action metadata
description: Validate catalogue action contracts and container ownership
inputs:
  files:
    description: Nonempty JSON array of action metadata paths
    required: true
outputs:
  checked:
    description: Number of checked files
  passed:
    description: Whether every file passed
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-action-metadata@sha256:ad3bb4f5c28b4bfd646862b19cec32b085332bf6a034d7baa2c98ac1bcd4ffb0
  args:
    - --files=${{ inputs.files }}

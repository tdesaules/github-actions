name: Test Python
description: Run unittest discovery under tests/unit in an independent container
inputs:
  directory:
    description: Project directory containing tests/unit
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-python@sha256:4e0a2c5e6e3abbdd4b8d2aa0b354c9e8f8fa677e4e5c2c4303620c8ced9c5dfd
  args:
    - --directory=${{ inputs.directory }}

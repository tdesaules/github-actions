name: Test Python
description: Run unittest discovery under tests/unit in an independent container
inputs:
  directory:
    description: Project directory containing tests/unit
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-python@sha256:d98d3b6ea20dca7ee256cc281bcb361ee379e40d8588a3f75bccd26d4a870934
  args:
    - --directory=${{ inputs.directory }}

name: Test Python
description: Run unittest discovery under tests/unit in an independent container
inputs:
  directory:
    description: Project directory containing tests/unit
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-python@sha256:82c515f8bdbfaa81f690b6c8ef825b350c23f5fcea10ed42e87171331287c640
  args:
    - --directory=${{ inputs.directory }}

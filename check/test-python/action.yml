name: Test Python
description: Run unittest discovery under tests/unit in an independent container
inputs:
  directory:
    description: Project directory containing tests/unit
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-python@sha256:89ca3915d2b0cc06a679c1789ee5aa05964d6e3a6b50e70dae97d74c7f5d6c8a
  args:
    - --directory=${{ inputs.directory }}

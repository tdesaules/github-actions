name: Test Python
description: Run unittest discovery under tests/unit in an independent container
inputs:
  directory:
    description: Project directory containing tests/unit
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-python@sha256:81b6b73b7dbb40e8cd454163935e5405a1f9d1a5971a9127b86ded6d7459b0ce
  args:
    - --directory=${{ inputs.directory }}

name: Test Python
description: Run unittest discovery under tests/unit in an independent container
inputs:
  directory:
    description: Project directory containing tests/unit
    default: .
  tests-directory:
    description: Project-relative discovery directory (requires the new qualified image)
    default: tests/unit
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-python@sha256:c472db34086e0242d3e486ab915bba06826aa73a3fb40ec1d4c645e21ab3b9cb
  env:
    INPUT_TESTS-DIRECTORY: ${{ inputs.tests-directory }}
  args:
    - --directory=${{ inputs.directory }}

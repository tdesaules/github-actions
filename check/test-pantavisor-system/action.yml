name: Test Pantavisor System
description: Check System compositions, unit tests, source syntax and local documentation links
inputs:
  directory:
    description: Pantavisor System project directory
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-pantavisor-system@sha256:eb1236ccea788cc54773c1f938b7a427bf54e391548cca4d926badfb93e84801
  args:
    - --directory=${{ inputs.directory }}

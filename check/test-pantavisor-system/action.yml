  directory:
    description: Pantavisor System project directory
    default: .
runs:
  using: docker
  image: docker://ghcr.io/tdesaules/github-actions/check-test-pantavisor-system@sha256:14fde05015f1878a4067e879374618fe997f8571593dd4e7c638b8a19265de33
  args:
    - --directory=${{ inputs.directory }}

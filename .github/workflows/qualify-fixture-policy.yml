name: qualify-fixture-policy
# Temporary bridge to activate the fixture generator after native qualification.
on:
  push:
    branches: [main]
    paths:
      - workflow/new-test-fixtures/Containerfile
      - .github/workflows/qualify-fixture-policy.yml
permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
jobs:
  image:
    uses: ./.github/workflows/image.yml
    with:
      image: workflow-new-test-fixtures
      directory: workflow/new-test-fixtures
      files: '["workflow/new-test-fixtures/Containerfile"]'
      full: false
      source-sha: ${{ github.sha }}
      mode: development
  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: oci-workflow-new-test-fixtures-amd64-${{ github.run_id }}
          path: .build/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: oci-workflow-new-test-fixtures-arm64-${{ github.run_id }}
          path: .build/arm64
      - name: Publish the exact qualified fixture generator
        uses: ./oci/merge-image-index
        with:
          sources: '[".build/amd64/image.oci.tar",".build/arm64/image.oci.tar"]'
          destination: docker://ghcr.io/tdesaules/github-actions/workflow-new-test-fixtures
          output: .build/image-index.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-fixture-generator
          path: .build/image-index.json
          include-hidden-files: true
          if-no-files-found: error

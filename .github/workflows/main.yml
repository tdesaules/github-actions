name: main
on:
  push:
    branches: ['**']
permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pipeline:
    # GitHub validates permissions of every nested job, including the release
    # job skipped in development. Other child jobs explicitly restrict theirs.
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/catalog.yml
    with:
      mode: development
